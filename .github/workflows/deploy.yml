name: Deploy Docs Site

# PigeonBox 文档站发布（org 用户站 https://pigeonbox.github.io/）。
#
# 内容真相源在 hub 仓 pigeonbox/pigeonbox 的 docs-site/，本仓不复制内容——
# 只做「检出 hub → 构建 → 发布」。hub 侧 docs-site/** 或 docs/** 有变更时，
# 由 hub 的 docs-site-publish workflow 用 PB_BOT_TOKEN 触发本 workflow 的
# repository_dispatch（事件类型 docs-site-changed）重建。
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每日兜底重建：跨仓触发万一漏了，靠定时补齐（hub 内容变更最迟一天上线）
    - cron: '17 4 * * *'
  repository_dispatch:
    types: [docs-site-changed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 文档站只关心最新一版：连续推送时把在跑的旧构建取消掉，别让发布在队列里
  # 排成长队（实测每次 Pages 发布 2~5 分钟，串行排队会让线上滞后好几轮）。
  cancel-in-progress: true

jobs:
  build:
    name: 构建文档站
    runs-on: ubuntu-latest
    steps:
      - name: 检出 hub 仓（内容真相源）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pigeonbox/pigeonbox
          path: hub

      - name: 装 Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/docs-site/package-lock.json

      - name: 装依赖
        run: npm ci
        working-directory: hub/docs-site

      # 构建即门禁：VitePress 构建失败（死链、语法错、include 路径失效）则不发布
      - name: 构建文档站
        env:
          # 「版本发布说明」页的数据源 = hub 仓的 Release（trainctl 生成的列车 notes）。
          # 本仓自带的 GITHUB_TOKEN 只能读本仓，跨仓读 hub 要用 org 级 PB_BOT_TOKEN；
          # 匿名请求会撞 GitHub API 限流(403)，故必须带 token。
          GITHUB_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
        run: npm run docs:build
        working-directory: hub/docs-site

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: hub/docs-site/.vitepress/dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
